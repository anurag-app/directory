function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function bufToB64(buf){let bin='';const b=new Uint8Array(buf);for(let i=0;i<b.byteLength;i++)bin+=String.fromCharCode(b[i]);return btoa(bin)}
async function decryptWithKey(k){
  const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(P.i)},k,b64ToBuf(P.c));
  const html=new TextDecoder().decode(dec);
  document.open();document.write(html);document.close();
}
async function unlock(pw){
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuf(P.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
    if(P.rem&&!P.auto){
      const rawKey=await crypto.subtle.exportKey('raw',k);
      localStorage.setItem('_tdr_dk',bufToB64(rawKey));
    }
    await decryptWithKey(k);
  }catch(e){
    localStorage.removeItem('_tdr_dk');
    document.getElementById('lockBox').style.display='block';
    if(pw)document.getElementById('errMsg').style.display='block';
  }
}
(async()=>{
  if(P.auto){return unlock(P.auto)}
  const savedKey=localStorage.getItem('_tdr_dk');
  if(savedKey){
    try{
      const k=await crypto.subtle.importKey('raw',b64ToBuf(savedKey),{name:'AES-GCM',length:256},false,['decrypt']);
      return await decryptWithKey(k);
    }catch(e){localStorage.removeItem('_tdr_dk')}
  }
  document.getElementById('lockBox').style.display='block';
})();
document.getElementById('unlockForm').addEventListener('submit',e=>{e.preventDefault();unlock(document.getElementById('pass').value)});
